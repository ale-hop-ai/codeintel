[package]
name = "codeintel"
version = "0.1.0"
description = "Query structural facts about a source tree with Datalog."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# Both benches are declared below. Without this, `benches/conditions.rs` — a
# module the two of them share via `#[path]`, not a bench — is auto-discovered
# as a third bench target with no `main`, and every item in it reads as dead.
autobenches = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
datalog.workspace = true
extract.workspace = true
facts.workspace = true
regex.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Wall clock over a pinned corpus, `docs/plan.md` M6. Not a CLI verb, and not in
# the gate: `tasks/bench.yml` runs it.
[[bench]]
name = "corpus"
harness = false

[[bench]]
name = "warm_phases"
harness = false

[lints]
workspace = true
