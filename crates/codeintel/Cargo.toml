[package]
name = "codeintel"
version = "0.1.0"
description = "Query structural facts about a source tree with Datalog."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
# Every bench is declared below. Without this, `benches/conditions.rs` — a
# module some of them share via `#[path]`, not a bench — is auto-discovered as
# a bench target of its own with no `main`, and every item in it reads as dead.
autobenches = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
datalog.workspace = true
extract.workspace = true
facts.workspace = true
regex.workspace = true
serde_json.workspace = true

[dev-dependencies]
blake3.workspace = true
tempfile.workspace = true

# Wall clock over a pinned corpus, `docs/plan.md` M6. Not a CLI verb, and not in
# the gate: `tasks/bench.yml` runs it.
[[bench]]
name = "corpus"
harness = false

[[bench]]
name = "warm_phases"
harness = false

# The scoreboard, `docs/50-self-improvement.md` § 3. Clock-free and exact, so
# unlike `corpus` it means the same thing on any machine. `tasks/score.yml`
# runs it.
[[bench]]
name = "score"
harness = false

[lints]
workspace = true
